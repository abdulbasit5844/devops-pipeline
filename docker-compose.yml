# Part I - containerized deployment (image pulled from Docker Hub)
services:
  db:
    image: mariadb:10.11
    container_name: a2_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mydb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"            # host 3307 -> container 3306
    volumes:
      - mysql_data:/var/lib/mysql                      # persistent database storage
      - ./db:/docker-entrypoint-initdb.d:ro            # schema + seed data (first start only)
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: aen8aen/devops-a2-web:latest
    container_name: a2_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8100:80"              # host 8100 -> container 80
    environment:
      MYSQL_HOST: db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      MYSQL_DATABASE: mydb
      APP_ENV_LABEL: "Part I - Docker Hub image"

volumes:
  mysql_data:
